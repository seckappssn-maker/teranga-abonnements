<style>
/* Layout: colonna unica da telefono, banda blu notte con filo oro in alto, barra schede in basso */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F5F7FB; --ink:#111A2B; --muted:#56637A; --line:#D9DFEA;
  --indigo:#1F4E8C; --indigo-ink:#FFFFFF; --band:#0E1B2C; --band-ink:#EEF3FB;
  --gold:#9A6200; --gold-soft:#FCEFD4; --gold-line:#F5B83D;
  --ok:#1D7348; --ok-soft:#DDF2E6; --warn:#A85A07; --warn-soft:#FBEBD5; --bad:#B42318; --bad-soft:#FBE1DE;
  --chip:#E3E9F3; --shadow:0 1px 2px rgba(17,26,43,.06),0 4px 14px rgba(17,26,43,.07);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111C; --surface:#121C2B; --surface2:#182436; --ink:#E9EFF8; --muted:#A1AEC4; --line:#26354D;
  --indigo:#7FB0F0; --indigo-ink:#0A111C; --band:#070D16; --band-ink:#EEF3FB;
  --gold:#F7C766; --gold-soft:#3A2C10; --gold-line:#F5B83D;
  --ok:#5ACB92; --ok-soft:#163626; --warn:#F2A54A; --warn-soft:#3B2711; --bad:#F2786C; --bad-soft:#3D1A18;
  --chip:#1C2A40; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111C; --surface:#121C2B; --surface2:#182436; --ink:#E9EFF8; --muted:#A1AEC4; --line:#26354D;
  --indigo:#7FB0F0; --indigo-ink:#0A111C; --band:#070D16; --band-ink:#EEF3FB;
  --gold:#F7C766; --gold-soft:#3A2C10; --gold-line:#F5B83D;
  --ok:#5ACB92; --ok-soft:#163626; --warn:#F2A54A; --warn-soft:#3B2711; --bad:#F2786C; --bad-soft:#3D1A18;
  --chip:#1C2A40; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.aname{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stitch{height:0;border-top:2px solid var(--gold-line);opacity:.9}
.mode{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;flex:none}
.mode button{border:0;background:none;color:var(--band-ink);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600}
.mode button.on{background:var(--gold-line);color:#1B1606}
main{padding-block:16px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:24px;line-height:1.15}
h2{font-size:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.fete{background:var(--gold-soft);border:1.5px dashed var(--gold-line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.fete b{font-family:var(--f-display);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.thumb{width:48px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}
.av{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--indigo);flex:none}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.st-coupe,.st-couture,.st-finition{background:var(--warn-soft);color:var(--warn)}
.st-pret{background:var(--ok-soft);color:var(--ok)}
.st-recu{background:var(--chip);color:var(--indigo)}
.st-livre{background:var(--chip);color:var(--muted)}
.reste{font-size:12.5px;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums}
.solde{font-size:12.5px;font-weight:700;color:var(--ok)}
.bad{color:var(--bad)!important;font-weight:600}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--indigo);color:var(--indigo-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.gold{background:var(--gold-line);color:#1B1606}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--indigo);color:var(--indigo-ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--indigo)}
nav.tabs svg{width:23px;height:23px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
/* catalogue */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--chip);max-width:100%}
.card-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card-t{font-weight:700;font-size:14.5px;line-height:1.25}
.price{font-family:var(--f-display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.tag{position:absolute;top:8px;left:8px;background:var(--gold-line);color:#1B1606;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.hbtn{border:1px solid rgba(255,255,255,.3);background:none;color:var(--band-ink);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.hchip{border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);color:var(--band-ink);white-space:nowrap}
.hchip.ok{background:#1F7A4D;color:#fff}.hchip.warn{background:var(--gold-line);color:#1B1606}.hchip.bad{background:#C0392B;color:#fff}
.sync{font-size:12px;opacity:.85;white-space:nowrap}.sync.err{color:#FFB4A9;opacity:1}
.code{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--gold)}
.linkbox{background:var(--surface2);border:1px dashed var(--gold-line);border-radius:10px;padding:10px 12px;font-size:13.5px;word-break:break-all;user-select:all}
.imgw{position:relative}
.pcount{position:absolute;bottom:8px;right:8px;background:rgba(10,12,30,.72);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcell{position:relative;aspect-ratio:4/5;max-width:100%}
.pcell img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.pcover{position:absolute;left:5px;bottom:5px;background:var(--gold-line);color:#1B1606;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px}
.pdel,.pmove{position:absolute;top:5px;border:0;width:28px;height:28px;border-radius:50%;background:rgba(10,12,30,.72);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.pdel{right:5px}.pmove{left:5px;font-size:13px}
.padd{aspect-ratio:4/5;max-width:100%;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);cursor:pointer;text-align:center;padding:4px}
.padd span{font-size:28px;line-height:1;color:var(--indigo)}
.padd small{font-size:11.5px;font-weight:600}
.gal{position:relative;border-radius:14px;overflow:hidden;background:var(--chip)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track img{flex:0 0 100%;width:100%;max-height:380px;object-fit:contain;scroll-snap-align:center}
.gal-n{position:absolute;top:10px;right:10px;background:rgba(10,12,30,.72);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dots i.on{background:#fff;width:18px;border-radius:9px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,12,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.panel{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mes{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.mes .f input{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kv b{font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.money b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.money span{font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.step{border:0;background:var(--chip);border-radius:9px;padding:8px 2px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.step i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.5}
.step.done{background:var(--indigo);color:var(--indigo-ink)}
.step.done i{opacity:1}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-line);border-radius:9px}
.photo-big{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:var(--chip)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:64px;height:76px;object-fit:cover;border-radius:10px}
.msg{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.reply{background:var(--gold-soft);border-radius:10px;padding:8px 11px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-height:96px}
.act svg{width:26px;height:26px;color:var(--gold)}
.act b{font-size:14.5px}
.act span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:14px;max-width:90%}
.note{font-size:12.5px;color:var(--muted)}
.hello{display:flex;flex-direction:column;gap:4px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
<style>
.st-ajour{background:var(--ok-soft);color:var(--ok)}.st-apayer{background:var(--warn-soft);color:var(--warn)}.st-retard{background:var(--bad-soft);color:var(--bad)}.st-inactif{background:var(--chip);color:var(--muted)}
.cli{border:0;background:var(--surface);border-radius:14px;padding:11px 13px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);border-left:4px solid var(--line);width:100%;min-width:0}
.cli.ajour{border-left-color:var(--ok)}.cli.apayer{border-left-color:var(--gold-line)}.cli.retard{border-left-color:var(--bad)}.cli.inactif{opacity:.6}
.timeline{display:flex;flex-direction:column;gap:8px}
.big-total{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.navd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode-b{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:700;font-size:13.5px}
.mode-b.on{border-color:var(--indigo);background:var(--indigo);color:var(--indigo-ink)}
.meter{height:12px;border-radius:999px;background:var(--chip);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.mo{border-radius:9px;padding:6px 2px;text-align:center;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--muted);line-height:1.15}
.mo small{display:block;font-weight:600;font-size:10px;opacity:.8}
.mo.paid{background:var(--ok-soft);color:var(--ok)}.mo.due{background:var(--bad-soft);color:var(--bad)}.mo.soon{background:var(--warn-soft);color:var(--warn)}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.stepper b{font-family:var(--f-display);font-size:28px;min-width:36px;text-align:center}
.bigstat{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.bigstat.ajour{background:var(--ok-soft);color:var(--ok)}.bigstat.apayer{background:var(--warn-soft);color:var(--warn)}.bigstat.retard{background:var(--bad-soft);color:var(--bad)}.bigstat.inactif{background:var(--chip);color:var(--muted)}
.bigstat .amt{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.stat b{font-size:clamp(14px,4.3vw,20px);letter-spacing:-.01em}
.sec-h>div{min-width:0}.panel .sec-h .pill{flex:none}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cats button{flex:none}
.soon-tag{display:inline-block;background:var(--gold-line);color:#1B1606;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:2px}
[hidden]{display:none!important}
</style>

<header class="top">

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const shift=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const daysTo=s=>Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5);
const dateFr=(s,opt)=>s?new Date(s+'T12:00').toLocaleDateString('fr-FR',opt||{weekday:'short',day:'numeric',month:'short'}):'';
const dayLabel=s=>{const d=daysTo(s);return d===0?'Aujourd’hui':d===1?'Demain':d===-1?'Hier':dateFr(s,{weekday:'long',day:'numeric',month:'long'})};
const fmt=n=>Math.round(+n||0).toLocaleString('fr-FR').replace(/[  ]/g,' ')+' F';
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
const initials=s=>String(s||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const client=id=>S.clients.find(c=>c.id===id);
const plan=id=>S.formules.find(f=>f.id===id);
const agent=id=>(S.agents||[]).find(a=>a.id===id);
const waNum=t=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9)d='221'+d;return d};
const waLink=(t,msg)=>'https://wa.me/'+waNum(t)+'?text='+encodeURIComponent(msg);
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const nowHm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const plural=(n,a,b)=>n+' '+(n>1?b:a);
const thisMonth=()=>today().slice(0,7);
const addMonths=(k,n)=>{let [y,m]=k.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+String(m).padStart(2,'0')};
const monthName=(k,long)=>new Date(k+'-15T12:00').toLocaleDateString('fr-FR',long?{month:'long',year:'numeric'}:{month:'short'}).replace('.','');
const monthsLabel=keys=>keys.map(k=>monthName(k,true)).join(', ');

/* ---------- le cœur : ce que chaque client doit ---------- */
function cPrix(c){const p=plan(c.planId);return num(c.prix)||num(p&&p.prix)}
function cStep(c){const p=plan(c.planId);return (PERIODES[p&&p.periode]||PERIODES.mois).m}
function dueDate(c,k){return k+'-'+String(Math.min(28,Math.max(1,+c.jour||1))).padStart(2,'0')}
function paysOf(id){return S.paiements.filter(p=>p.clientId===id)}
function paidSet(c){const s=new Set();paysOf(c.id).forEach(p=>(p.periodes||[]).forEach(k=>s.add(k)));return s}
function etat(c){
  const step=cStep(c),prix=cPrix(c),paid=paidSet(c);const keys=[];let k=c.debut||thisMonth();let guard=0;
  while(dueDate(c,k)<=today()&&guard++<240){keys.push(k);k=addMonths(k,step)}
  const next=k;const unpaid=c.actif===false?[]:keys.filter(x=>!paid.has(x));
  let st='ajour',retard=0;if(c.actif===false)st='inactif';else if(unpaid.length){retard=-daysTo(dueDate(c,unpaid[0]));st=retard>(+S.shop.retard||5)?'retard':'apayer'}
  /* payé jusqu'à : dernière période payée d'affilée */
  let until=null;let kk=c.debut||thisMonth();guard=0;while(paid.has(kk)&&guard++<240){until=kk;kk=addMonths(kk,step)}
  const nextDue=unpaid.length?dueDate(c,unpaid[0]):(()=>{let x=next;guard=0;while(paid.has(x)&&guard++<240)x=addMonths(x,step);return dueDate(c,x)})();
  return {st,unpaid,du:unpaid.length*prix,retard,prix,step,next,until:until?addMonths(until,step-1):null,nextDue,paid,keys}}
function periodsToPay(c,n){const e=etat(c);const out=[...e.unpaid];let k=e.next;let g=0;while(out.length<n&&g++<240){if(!e.paid.has(k)&&!out.includes(k))out.push(k);k=addMonths(k,e.step)}return out.slice(0,n).sort()}
function perLabel(c,k){const st=cStep(c);return st===1?monthName(k,true):monthName(k,true)+' → '+monthName(addMonths(k,st-1),true)}

/* ---------- données d'exemple ---------- */

    C('Restaurant Chez Fatou','77 318 90 05','Unité 26',f2,5,addMonths(m,-3),ag2),C('Moussa Sarr','70 455 61 28','Unité 17',f1,1,addMonths(m,-2),ag1),C('Mame Diarra Fall','77 621 40 18','Unité 26',f3,1,addMonths(m,-2),ag2),
    C('Ousmane Ba','78 999 11 00','Unité 15',f1,15,addMonths(m,-8),ag1,{actif:false})];
  let seq=0;const P=(c,keys,mode,dOff,ag)=>({id:uid(),no:++seq,clientId:c.id,montant:keys.length*(c.planId===f3.id?30000:c.planId===f2.id?5000:3000),mode,date:addDays(dOff),heure:'10:'+String(10+seq).slice(-2),periodes:keys,agentId:ag?ag.id:'',source:'manuel'});

    P(cs[1],[addMonths(m,-4),addMonths(m,-3),addMonths(m,-2)],'Espèces',-55,ag1),
    P(cs[2],[addMonths(m,-6),addMonths(m,-5),addMonths(m,-4),addMonths(m,-3),addMonths(m,-2),addMonths(m,-1)],'Orange Money',-25,ag2),
    P(cs[3],[addMonths(m,-3),addMonths(m,-2),addMonths(m,-1)],'Espèces',-8,ag2),P(cs[3],[m],'Wave',-1,ag2),

  const dem=[{id:uid(),clientId:cs[4].id,type:'paiement',texte:'Payé par Wave ce matin',photo:null,data:{montant:6000,mode:'Wave',ref:'T_8F2K91QX',nb:2},date:today(),statut:'nouveau',reponse:''},
    {id:uid(),clientId:null,nomV:'Ndèye Sow',telV:'77 700 80 90',type:'inscription',texte:'Maison bleue après la pharmacie',data:{planId:f1.id,planNom:'Ménage',quartier:'Unité 26'},date:today(),statut:'nouveau',reponse:''}];
  return {v:1,demo:true,seq,shop:{nom:'Keur Massar Propre',tel:'77 123 45 67',ville:'Keur Massar',adresse:'',activite:'Ramassage d’ordures',wave:'77 123 45 67',om:'77 123 45 67',payLink:'',retard:5,msg:''},
    formules:[f1,f2,f3],agents:[ag1,ag2],clients:cs,paiements:pays,demandes:dem}}
function fixState(o){if(!o)return o;['formules','agents','clients','paiements'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});if(!Array.isArray(o.demandes))o.demandes=[];
  o.shop=o.shop||{nom:'Mon service',tel:'',ville:'',adresse:'',activite:'',wave:'',om:'',payLink:'',retard:5,msg:''};if(o.shop.retard==null)o.shop.retard=5;
  if(!o.seq)o.seq=o.paiements.reduce((m,p)=>Math.max(m,+p.no||0),0);o.clients.forEach(c=>{if(!c.code)c.code=newCode();if(c.actif==null)c.actif=true;if(!c.debut)c.debut=thisMonth()});return o}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=fixState(JSON.parse(r));return}}catch(e){}S=fixState(seed())}

function readPhoto(file,cb){if(!file)return;const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{const m=1100,r=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};img.onerror=()=>toast('Photo illisible');img.src=fr.result};fr.readAsDataURL(file)}

const I={

/* ---------- rendu ---------- */
function render(){
  if(ONLINE&&onlineScreen())return;
  $('#aname').textContent=S.shop.nom;renderHdr();
  const nNew=S.demandes.filter(d=>d.statut==='nouveau').length;const nRel=S.clients.filter(c=>{const e=etat(c);return e.st==='retard'||e.st==='apayer'}).length;
  const tabs=mode==='shop'
    ?[['accueil','Accueil',I.home,nNew],['clients','Clients',I.users],['relances','Relances',I.bell,nRel],['caisse','Caisse',I.cash]]
    :[['c-home','Accueil',I.home],['c-accueil','Mon compte',I.card],['c-messages','Messages',I.msg]];
  $('#tabs').innerHTML=tabs.map(([k,l,ic,b])=>`<button class="${view===k?'on':''}" data-act="tab" data-v="${k}" aria-label="${l}">${ic}<span>${l}</span>${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
  const V={accueil,clients,relances,caisse,demandes,formules:formulesView,'c-home':cHome,'c-accueil':cAccueil,'c-messages':cMessages};
  $('#main').innerHTML=(V[view]||accueil)();
}
const demoBanner=()=>S.demo?`<div class="banner"><span>Ce sont des <b>exemples</b> pour découvrir l'app.</span><button class="btn sm ghost" data-act="clear-demo">Commencer à vide</button></div>`:'';
function cliRow(c){const e=etat(c);const p=plan(c.planId);
  return `<button class="cli ${e.st}" data-act="client" data-id="${c.id}"><div class="av">${initials(c.nom)}</div><div class="row-main"><div class="row-t">${esc(c.nom)}</div><div class="row-s">${esc([c.quartier,p?p.nom:''].filter(Boolean).join(' · '))}${agent(c.agentId)?' · '+esc(agent(c.agentId).nom):''}</div><div class="row-s">${e.st==='ajour'?'Payé jusqu’à fin '+(e.until?monthName(e.until,true):''):e.st==='inactif'?'Abonnement suspendu':e.unpaid.length?esc(monthsLabel(e.unpaid.slice(0,3)))+(e.unpaid.length>3?'…':''):''}</div></div><div class="row-end"><span class="pill st-${e.st}">${STL[e.st]}</span>${e.du?`<span class="reste">${fmt(e.du)}</span>`:''}</div></button>`}
function monthStats(){const mo=thisMonth();const act=S.clients.filter(c=>c.actif!==false);
  let attendu=0,recu=0;act.forEach(c=>{const st=cStep(c);let k=c.debut||mo;let g=0;while(k<mo&&g++<240)k=addMonths(k,st);if(k===mo){attendu+=cPrix(c);if(paidSet(c).has(mo))recu+=cPrix(c)}});
  const enc=S.paiements.filter(p=>String(p.date).slice(0,7)===mo).reduce((a,p)=>a+num(p.montant),0);
  const du=act.reduce((a,c)=>a+etat(c).du,0);return {attendu,recu,enc,du,act:act.length}}
function accueil(){const ms=monthStats();const es=S.clients.map(c=>[c,etat(c)]);
  const ajour=es.filter(([c,e])=>e.st==='ajour').length,retard=es.filter(([c,e])=>e.st==='retard').sort((a,b)=>b[1].retard-a[1].retard);
  const news=S.demandes.filter(d=>d.statut==='nouveau').sort((a,b)=>(a.type==='paiement'?0:1)-(b.type==='paiement'?0:1));
  const pc=ms.attendu?Math.round(ms.recu/ms.attendu*100):0;
  return `${demoBanner()}${typeof a2hs==='function'?a2hs():''}
  <div class="sec-h"><h1>${new Date().getHours()<17?'Bonjour':'Bonsoir'}, ${esc(S.shop.nom)}</h1><button class="btn sm ghost" data-act="settings">Réglages</button></div>
  <div class="stats"><div class="stat"><b>${ms.act}</b><span>Abonnés actifs</span></div><div class="stat"><b>${ajour}</b><span>À jour</span></div><div class="stat"><b>${fmt(ms.du)}</b><span>Reste à encaisser</span></div></div>
  <div class="panel"><div class="sec-h"><span class="lbl">${esc(monthName(thisMonth(),true))}</span><b style="font-variant-numeric:tabular-nums">${pc} %</b></div><div class="meter"><i style="width:${pc}%"></i></div><div class="small muted">${fmt(ms.recu)} reçus sur ${fmt(ms.attendu)} attendus ce mois · ${fmt(ms.enc)} encaissés en tout ce mois</div></div>
  ${!S.formules.length||!S.clients.length?`<div class="panel" style="border:2px solid var(--gold-line)"><h3>Pour commencer</h3>
    <div class="small">${S.formules.length?'✓':'1.'} Créez vos formules (ex. « Ménage 3 000 F par mois »).</div><div class="small">${S.clients.length?'✓':'2.'} Ajoutez vos abonnés avec le jour où ils paient.</div><div class="small">3. Dans Réglages, mettez vos numéros Wave et Orange Money.</div>
    ${S.formules.length?'':'<button class="btn gold" data-act="new-plan">Créer ma première formule</button>'}</div>`:''}
  <div class="btns"><button class="btn" data-act="new-client">+ Abonné</button><button class="btn gold" data-act="enc-pick">Encaisser</button></div>
  ${news.length?`<section class="sec"><div class="sec-h"><h2>À traiter</h2><button class="btn sm ghost" data-act="tab" data-v="demandes">Tout voir</button></div><div class="list">${news.slice(0,5).map(demRow).join('')}</div></section>`:''}
  ${retard.length?`<section class="sec"><div class="sec-h"><h2>En retard</h2><button class="btn sm ghost" data-act="tab" data-v="relances">Relancer</button></div><div class="timeline">${retard.slice(0,5).map(([c])=>cliRow(c)).join('')}</div></section>`:`<div class="panel"><b>Personne en retard 👏</b><span class="small muted">Tous vos abonnés ont payé à temps.</span></div>`}`}
function clients(){
  const F={tous:()=>true,ajour:e=>e.st==='ajour',apayer:e=>e.st==='apayer',retard:e=>e.st==='retard',inactif:e=>e.st==='inactif'};
  const L={tous:'Tous',ajour:'À jour',apayer:'À payer',retard:'En retard',inactif:'Suspendus'};
  let list=S.clients.map(c=>[c,etat(c)]);const cnt=k=>list.filter(([c,e])=>F[k](e)).length;
  list=list.filter(([c,e])=>F[cF](e)&&(!agF||c.agentId===agF||(agF.startsWith('q:')&&c.quartier===agF.slice(2))));
  if(q){const qq=q.toLowerCase();list=list.filter(([c])=>(c.nom+' '+c.tel+' '+(c.quartier||'')).toLowerCase().includes(qq))}
  list.sort((a,b)=>({retard:0,apayer:1,ajour:2,inactif:3}[a[1].st]-{retard:0,apayer:1,ajour:2,inactif:3}[b[1].st])||a[0].nom.localeCompare(b[0].nom));
  const quartiers=[...new Set(S.clients.map(c=>c.quartier).filter(Boolean))].sort();

  const byAg=S.agents.map(a=>[a,pm.filter(p=>p.agentId===a.id).reduce((s,p)=>s+num(p.montant),0)]).filter(x=>x[1]);

  <div class="panel"><div class="lbl">${esc(monthName(mo,true))}</div><div class="kv" style="grid-template-columns:1fr"><div><span>Encaissé</span><b>${fmt(ms.enc)}</b></div><div><span>Attendu ce mois</span><b>${fmt(ms.attendu)}</b></div><div><span>Reste à encaisser (tous les mois)</span><b>${fmt(ms.du)}</b></div>${byAg.map(([a,v])=>`<div><span>👤 ${esc(a.nom)}</span><b>${fmt(v)}</b></div>`).join('')}</div></div>`}

function demSummary(d){const x=d.data||{};if(d.type==='paiement')return fmt(x.montant)+' par '+(x.mode||'?')+(x.ref?' · réf. '+x.ref:'')+(d.texte?' — '+d.texte:'');

  <div class="panel"><div class="lbl">Mois</div><div class="months">${grid.map(x=>{const paid=e.paid.has(x);const due=e.unpaid.includes(x);return `<div class="mo ${paid?'paid':due?'due':'soon'}">${esc(monthName(x))}<small>${x.slice(2,4)}</small></div>`}).join('')}</div></div>

  ${pays.length?`<section class="sec"><h3>Paiements</h3><div class="list">${pays.map(x=>`<button class="row" data-act="pay" data-id="${x.id}"><div class="row-main"><div class="row-t">${fmt(x.montant)} · ${esc(x.mode)}</div><div class="row-s">${dateFr(x.date,{day:'numeric',month:'short',year:'numeric'})} · ${esc(monthsLabel(x.periodes||[]))}</div></div><span class="small muted">N° ${String(x.no).padStart(4,'0')}</span></button>`).join('')}</div></section>`:''}
  <div class="btns"><button class="btn ghost" data-act="edit-client" data-id="${c.id}">Modifier</button>${c.actif!==false?`<button class="btn ghost" data-act="susp" data-id="${c.id}">Suspendre</button>`:`<button class="btn gold" data-act="react" data-id="${c.id}">Réactiver</button>`}</div>
  <button class="btn danger sm" data-act="del-client" data-id="${c.id}">Supprimer l’abonné</button>`)}
function accessMsg_(c){return typeof accessMsg==='function'?accessMsg(c):''}
function clientLink(c){return typeof portalLink==='function'&&ONLINE&&S.shopId?portalLink()+'&n='+waNum(c.tel).slice(-9)+'&k='+c.code:''}

/* ---------- encaisser ---------- */
function encSheet(){const c=client(enc.clientId);const e=etat(c);const keys=periodsToPay(c,enc.n);const tot=keys.length*cPrix(c);if(enc.amt==null)enc.amt=tot;
  sheet('Encaisser · '+c.nom,`<div class="panel">${e.du?`<div class="small">Doit <b>${fmt(e.du)}</b> (${esc(monthsLabel(e.unpaid))})</div>`:'<div class="small">À jour : ce paiement sera pour les mois suivants (avance).</div>'}
  <div class="lbl">Combien de ${e.step===1?'mois':'périodes'} ?</div><div class="stepper"><button data-act="en-n" data-v="-1" aria-label="Moins">−</button><b>${enc.n}</b><button data-act="en-n" data-v="1" aria-label="Plus">+</button>${e.unpaid.length>1?`<button class="btn sm ghost" style="width:auto;height:auto;font-size:13px" data-act="en-all">Tout (${e.unpaid.length})</button>`:''}</div>
  <div class="small"><b>${esc(keys.map(k=>perLabel(c,k)).join(', '))}</b></div>
  <div class="f"><label for="en-amt">Montant reçu (F)</label><input id="en-amt" inputmode="numeric" value="${enc.amt}"></div>
  <div class="lbl">Payé par</div><div class="modes">${MODES.map(m=>`<button class="mode-b ${enc.mode===m?'on':''}" data-act="en-mode" data-v="${m}">${m}</button>`).join('')}</div>
  ${S.agents.length?`<div class="f"><label for="en-ag">Encaissé par</label><select id="en-ag">${agentOpts(enc.agentId)}</select></div>`:''}
  <div class="f"><label for="en-note">Note</label><input id="en-note" value="${esc(enc.note||'')}" placeholder="ex. réf. Wave"></div></div>
  <button class="btn gold block" data-act="en-save">Enregistrer · ${fmt(tot)}</button>`)}
function openEnc(cid,pre){const c=client(cid);if(!c)return;const e=etat(c);enc={clientId:cid,n:Math.max(1,(pre&&pre.n)||e.unpaid.length||1),mode:(pre&&pre.mode)||'Espèces',agentId:c.agentId||'',amt:pre&&pre.amt!=null?pre.amt:null,note:pre&&pre.note||'',demId:pre&&pre.demId||''};encSheet()}
function readEnc(){if(!enc)return;const a=$('#en-amt');if(a)enc.amt=a.value;enc.note=val('en-note');if($('#en-ag'))enc.agentId=val('en-ag')}
function recuText(p){const c=client(p.clientId)||{};return `*${S.shop.nom}*${S.shop.tel?'\nTél : '+S.shop.tel:''}\n\nREÇU N° ${String(p.no).padStart(4,'0')}\nDate : ${dateFr(p.date,{day:'numeric',month:'long',year:'numeric'})}\nAbonné : ${c.nom||''}\nPour : ${monthsLabel(p.periodes||[])}\nMontant : ${fmt(p.montant)}\nPayé par : ${p.mode}${agent(p.agentId)?'\nEncaissé par : '+agent(p.agentId).nom:''}\n\nMerci !`}
function paySheet(id){const p=S.paiements.find(x=>x.id===id);if(!p)return;const c=client(p.clientId)||{};
  sheet('Reçu N° '+String(p.no).padStart(4,'0'),`<div class="panel"><div class="row-t">${esc(c.nom||'')}</div><div class="kv" style="grid-template-columns:1fr"><div><span>Date</span><b>${dateFr(p.date,{day:'numeric',month:'long',year:'numeric'})} · ${esc(p.heure||'')}</b></div><div><span>Pour</span><b>${esc(monthsLabel(p.periodes||[]))}</b></div><div><span>Montant</span><b>${fmt(p.montant)}</b></div><div><span>Payé par</span><b>${esc(p.mode)}</b></div>${agent(p.agentId)?`<div><span>Encaissé par</span><b>${esc(agent(p.agentId).nom)}</b></div>`:''}${p.note?`<div><span>Note</span><b>${esc(p.note)}</b></div>`:''}</div></div>
  ${c.tel?`<a class="btn wa block" href="${waLink(c.tel,recuText(p))}" target="_blank" rel="noopener">${I.wa} Envoyer le reçu</a>`:''}
  <button class="btn danger sm" data-act="del-pay" data-id="${p.id}">Annuler ce paiement</button>`)}

/* ---------- autres feuilles ---------- */
function planForm(f){f=f||{nom:'',prix:'',periode:'mois',desc:''};
  sheet(f.id?'Modifier la formule':'Nouvelle formule',`<div class="panel"><div class="f"><label for="pf-nom">Nom</label><input id="pf-nom" value="${esc(f.nom)}" placeholder="ex. Ménage"></div>
  <div class="two"><div class="f"><label for="pf-prix">Prix (F)</label><input id="pf-prix" inputmode="numeric" value="${esc(f.prix)}"></div><div class="f"><label for="pf-per">Payé</label><select id="pf-per">${Object.entries(PERIODES).map(([k,v])=>`<option value="${k}" ${k===f.periode?'selected':''}>${v.nom}</option>`).join('')}</select></div></div>
  <div class="f"><label for="pf-desc">Ce qui est inclus</label><input id="pf-desc" value="${esc(f.desc||'')}" placeholder="ex. ramassage 3 fois par semaine"></div></div>
  <button class="btn block" data-act="save-plan" data-id="${f.id||''}">Enregistrer</button>${f.id?`<button class="btn danger sm" data-act="del-plan" data-id="${f.id}">Supprimer la formule</button>`:''}`)}
function demSheet(id){const d=S.demandes.find(x=>x.id===id);if(!d)return;const cl=dCl(d);const x=d.data||{};
  let extra='';if(d.type==='paiement'&&client(d.clientId)){const c=client(d.clientId);const e=etat(c);const n=Math.max(1,Math.round(num(x.montant)/Math.max(1,cPrix(c))))||1;
    extra=`<div class="panel"><div class="small">Avant de valider, vérifiez sur votre téléphone que l’argent est bien arrivé sur ${esc(x.mode||'Wave')}.</div><div class="small">Il devait <b>${fmt(e.du)}</b>.</div><button class="btn gold" data-act="dem-ok" data-id="${d.id}" data-n="${n}">C’est bien reçu : valider (${plural(n,e.step===1?'mois':'période',e.step===1?'mois':'périodes')})</button><button class="btn ghost" data-act="dem-ko" data-id="${d.id}">Pas reçu</button></div>`}
  if(d.type==='inscription')extra=`<button class="btn gold block" data-act="dem-insc" data-id="${d.id}">Ajouter comme abonné</button>`;
  sheet((DT[d.type]||'Message')+' · '+cl.nom,`${d.photo?`<img class="photo-big" src="${d.photo}" alt="Capture du paiement">`:''}<div class="panel">${cl.visiteur?`<div class="reply"><b>Nouveau</b> : ${esc(cl.nom)} · ${esc(cl.tel)}</div>`:''}<div>${esc(demSummary(d))}</div><div class="small muted">Reçu le ${dateFr(d.date,{day:'numeric',month:'long'})}</div></div>${extra}
  <div class="panel"><div class="f"><label for="dm-rep">Votre réponse (l’abonné la voit sur sa page)</label><textarea id="dm-rep">${esc(d.reponse)}</textarea></div><div class="btns"><button class="btn" data-act="dem-reply" data-id="${d.id}">Répondre</button>${cl.tel?`<a class="btn wa" href="${waLink(cl.tel,'Bonjour '+cl.nom+', ')}" target="_blank" rel="noopener">${I.wa} WhatsApp</a>`:''}</div></div>`)}
function settings(){const s=S.shop;
  sheet('Réglages',`<div class="panel"><div class="f"><label for="st-nom">Nom de votre service</label><input id="st-nom" value="${esc(s.nom)}"></div>
  <div class="f"><label for="st-act">Activité</label><select id="st-act">${opts(ACTIVITES,s.activite)}</select></div>
  <div class="two"><div class="f"><label for="st-tel">Téléphone WhatsApp</label><input id="st-tel" inputmode="tel" value="${esc(s.tel)}"></div><div class="f"><label for="st-v">Ville</label><input id="st-v" value="${esc(s.ville)}"></div></div></div>
  <div class="panel"><h3>Où vos abonnés paient</h3><div class="two"><div class="f"><label for="st-wave">Numéro Wave</label><input id="st-wave" inputmode="tel" value="${esc(s.wave||'')}"></div><div class="f"><label for="st-om">Numéro Orange Money</label><input id="st-om" inputmode="tel" value="${esc(s.om||'')}"></div></div>
  <div class="f"><label for="st-link">Lien de paiement Wave (facultatif)</label><input id="st-link" inputmode="url" value="${esc(s.payLink||'')}" placeholder="https://pay.wave.com/…"></div>
  <div class="two"><div class="f"><label for="st-ret">En retard après (jours)</label><input id="st-ret" inputmode="numeric" value="${esc(s.retard)}"></div><div></div></div>
  <div class="f"><label for="st-msg">Phrase en plus dans les rappels</label><input id="st-msg" value="${esc(s.msg||'')}" placeholder="ex. Le ramassage s’arrête après 15 jours de retard."></div></div>
  <div class="panel"><h3>Paiement automatique <span class="soon-tag">Bientôt</span></h3><div class="small muted">Bientôt, vos abonnés paieront directement dans l’app (Wave, Orange Money, carte) et le paiement sera validé tout seul, sans capture. Contactez Seck Apps pour être parmi les premiers.</div></div>
  <div class="panel"><h3>Agents qui encaissent</h3><div class="list" style="box-shadow:none;background:var(--surface2)">${S.agents.map(a=>`<div class="row"><div class="av">${initials(a.nom)}</div><div class="row-main"><div class="row-t">${esc(a.nom)}</div><div class="row-s">${esc(a.tel||'')} · ${plural(S.clients.filter(c=>c.agentId===a.id).length,'abonné','abonnés')}</div></div><button class="btn sm ghost" data-act="del-ag" data-id="${a.id}">Retirer</button></div>`).join('')||'<div class="empty">Vous encaissez seul ? Pas besoin d’agents.</div>'}</div>
  <div class="two"><div class="f"><label for="st-agn">Nom</label><input id="st-agn" placeholder="ex. Ibou"></div><div class="f"><label for="st-agt">Téléphone</label><input id="st-agt" inputmode="tel"></div></div><button class="btn ghost" data-act="add-ag">Ajouter l’agent</button></div>
  <button class="btn block" data-act="save-settings">Enregistrer</button>${ONLINE?onlineSettings():''}`)}

/* ---------- feuilles côté client ---------- */
function cInsc(){sheet('M’abonner',`<div class="panel">${S.formules.length?`<div class="f"><label for="ci-plan">Formule</label><select id="ci-plan">${planOpts((S.formules[0]||{}).id)}</select></div>`:''}
  <div class="two"><div class="f"><label for="ci-q">Quartier</label><input id="ci-q"></div><div class="f"><label for="ci-adr">Repère</label><input id="ci-adr" placeholder="ex. après la pharmacie"></div></div>${me()?'':guestFields()}
  <p class="note" style="margin:0">${esc(S.shop.nom)} vous confirme sur WhatsApp et vous envoie votre code.</p></div><button class="btn gold block" data-act="ci-send">Envoyer</button>`)}
function cQuestion(){sheet('Poser une question',`<div class="panel"><div class="f"><label for="cm-t">Votre question</label><textarea id="cm-t"></textarea></div>${me()?'':guestFields()}</div><button class="btn block" data-act="cq-send">Envoyer</button>`)}
function cPaid(){const c=me();const e=etat(c);capPhoto=null;
  sheet('J’ai payé',`<div class="panel"><div class="two"><div class="f"><label for="cp-m">Montant envoyé (F)</label><input id="cp-m" inputmode="numeric" value="${e.du||cPrix(c)}"></div><div class="f"><label for="cp-mode">Par</label><select id="cp-mode">${opts(['Wave','Orange Money','Espèces'],'Wave')}</select></div></div>
  <div class="f"><label for="cp-ref">Référence de la transaction (facultatif)</label><input id="cp-ref" placeholder="ex. T_8F2K91QX"></div>
  <div class="f"><label>Capture de l’écran de paiement</label><div id="cp-img"></div><label class="btn ghost" for="cp-in">Ajouter la capture<input type="file" accept="image/*" id="cp-in" data-cap="1" hidden></label></div>
  <div class="f"><label for="cp-t">Message (facultatif)</label><input id="cp-t"></div></div><button class="btn gold block" data-act="cp-send">Envoyer</button>`)}
function guestCheck(){const nom=val('vz-nom'),tel=val('vz-tel');if(nom.length<2){toast('Écrivez votre nom');return null}if(tel.replace(/\D/g,'').length<9){toast('Écrivez votre numéro WhatsApp');return null}saveGuest(nom,tel);return {nom,tel}}
async function clientSend(d,btn){const c=me();if(!c){const g=guestCheck();if(!g)return;d.clientId=null;d.nomV=g.nom;d.telV=g.tel}else d.clientId=c.id;return sendDem(d,btn)}
function ensureClient(d){if(client(d.clientId))return d.clientId;return null}

/* ---------- actions ---------- */
const A={
  mode:e=>{mode=e.dataset.v;view=mode==='shop'?'accueil':'c-home';q='';render();scrollTo(0,0)},
  tab:e=>{view=e.dataset.v;q='';closeSheet();render();scrollTo(0,0)},
  close:()=>closeSheet(),
  'clear-demo':()=>{S=fixState({v:1,demo:false,shop:{nom:'Mon service',tel:'',ville:'',activite:'',wave:'',om:'',payLink:'',retard:5,msg:''},formules:[],agents:[],clients:[],paiements:[],demandes:[]});viewAs=null;save();render();settings();toast('Exemples effacés')},
  settings,
  'save-settings':()=>{S.shop={...S.shop,nom:val('st-nom')||'Mon service',activite:val('st-act'),tel:val('st-tel'),ville:val('st-v'),wave:val('st-wave'),om:val('st-om'),payLink:/^https?:\/\//.test(val('st-link'))?val('st-link'):'',retard:Math.max(0,num(val('st-ret'))),msg:val('st-msg')};save();closeSheet();render();toast('Enregistré')},
  'add-ag':()=>{const n=val('st-agn');if(!n)return toast('Écrivez le nom de l’agent');S.agents.push({id:uid(),nom:n,tel:val('st-agt')});save();settings()},
  'del-ag':e=>{if(delArm!==e.dataset.id){delArm=e.dataset.id;e.textContent='Sûr ?';return}S.agents=S.agents.filter(a=>a.id!==e.dataset.id);S.clients.forEach(c=>{if(c.agentId===e.dataset.id)c.agentId=''});save();settings()},
  'c-f':e=>{cF=e.dataset.v;render()},
  'ag-f':e=>{agF=e.dataset.v;render()},
  'new-client':()=>clientForm(),
  'edit-client':e=>clientForm(client(e.dataset.id)),
  'save-client':e=>{const nom=val('cl-nom');if(!nom)return toast('Écrivez le nom');if(!val('cl-plan'))return toast('Choisissez la formule');
    if(ONLINE&&!e.dataset.id&&S.clients.length>=quota().max)return toast('Limite de votre formule atteinte ('+quota().max+' abonnés) : passez à la formule plus grande');
    const d={nom,tel:val('cl-tel'),quartier:val('cl-q'),adresse:val('cl-adr'),planId:val('cl-plan'),prix:num(val('cl-prix'))||'',jour:Math.min(28,Math.max(1,num(val('cl-jour'))||1)),debut:val('cl-deb')||thisMonth(),agentId:val('cl-ag'),note:val('cl-note')};
    let id=e.dataset.id;if(id)Object.assign(client(id),d);else{id=uid();S.clients.push({id,...d,actif:true,code:newCode()})}
    if(e.dataset.dem){const dm=S.demandes.find(x=>x.id===e.dataset.dem);if(dm){dm.statut='traite';dm.reponse=dm.reponse||'Bienvenue ! Votre abonnement est enregistré. Vous allez recevoir votre code sur WhatsApp.';demSave(dm)}}
    save();render();clientSheet(id);toast('Abonné enregistré')},
  client:e=>{if(client(e.dataset.id))clientSheet(e.dataset.id)},
  'new-code':e=>{const c=client(e.dataset.id);c.code=newCode();save();clientSheet(c.id);toast('Nouveau code : '+c.code)},
  susp:e=>{const c=client(e.dataset.id);if(delArm!=='s'+c.id){delArm='s'+c.id;e.textContent='Touchez encore : il ne paie plus jusqu’à la reprise';return}c.actif=false;c.suspendu=today();save();render();clientSheet(c.id);toast('Abonnement suspendu')},
  react:e=>{const c=client(e.dataset.id);const e0=etat({...c,actif:true});c.actif=true;if(e0.unpaid.length){c.debut=thisMonth()}save();render();clientSheet(c.id);toast('Abonnement repris à partir de '+monthName(thisMonth(),true))},
  'del-client':e=>{if(delArm!==e.dataset.id){delArm=e.dataset.id;e.textContent='Touchez encore pour supprimer (avec ses paiements)';return}const id=e.dataset.id;S.clients=S.clients.filter(c=>c.id!==id);S.paiements=S.paiements.filter(p=>p.clientId!==id);save();closeSheet();render();toast('Abonné supprimé')},
  'enc-pick':()=>{const list=S.clients.filter(c=>c.actif!==false).map(c=>[c,etat(c)]).sort((a,b)=>b[1].du-a[1].du||a[0].nom.localeCompare(b[0].nom));
    sheet('Encaisser',list.length?`<input class="search" id="ep-q" type="search" placeholder="Chercher un abonné…" data-input="ep"><div class="timeline" id="ep-list">${list.map(([c])=>cliRow(c).replace('data-act="client"','data-act="enc"')).join('')}</div>`:'<div class="empty">Ajoutez d’abord un abonné.</div>')},
  enc:e=>openEnc(e.dataset.id),
  'en-n':e=>{readEnc();enc.n=Math.max(1,Math.min(24,enc.n+(+e.dataset.v)));enc.amt=null;encSheet()},
  'en-all':()=>{readEnc();enc.n=etat(client(enc.clientId)).unpaid.length;enc.amt=null;encSheet()},
  'en-mode':e=>{readEnc();enc.mode=e.dataset.v;encSheet()},
  'en-save':()=>{readEnc();const c=client(enc.clientId);const keys=periodsToPay(c,enc.n);const amt=num(enc.amt);if(!amt)return toast('Écrivez le montant');
    S.seq=(S.seq||0)+1;const p={id:uid(),no:S.seq,clientId:c.id,montant:amt,mode:enc.mode,date:today(),heure:nowHm(),periodes:keys,agentId:enc.agentId||'',note:enc.note||'',source:enc.demId?'client':'manuel'};S.paiements.push(p);
    if(enc.demId){const dm=S.demandes.find(x=>x.id===enc.demId);if(dm){dm.statut='traite';dm.reponse=`Paiement bien reçu, merci ! Reçu N° ${String(p.no).padStart(4,'0')} (${monthsLabel(keys)}).`;demSave(dm)}}
    save();closeSheet();render();paySheet(p.id);toast('Encaissé : '+fmt(amt))},
  pay:e=>paySheet(e.dataset.id),
  'del-pay':e=>{if(delArm!==e.dataset.id){delArm=e.dataset.id;e.textContent='Touchez encore pour annuler';return}S.paiements=S.paiements.filter(p=>p.id!==e.dataset.id);save();closeSheet();render();toast('Paiement annulé')},
  'rel-one':e=>{const c=client(e.dataset.id);c.relance=today();save();setTimeout(render,400)},
  'rel-msg':()=>{sheet('Message de rappel',`<div class="panel"><div class="small muted">Voici le message envoyé (exemple). Vous pouvez ajouter une phrase dans Réglages.</div><div class="reply" style="white-space:pre-wrap">${esc(S.clients[0]?relMsg(S.clients.find(c=>etat(c).du)||S.clients[0]):'')}</div><button class="btn ghost" data-act="settings">Ajouter une phrase</button></div>`)},
  'rel-all':()=>{relIdx=0;relStep()},
  'rel-next':()=>{relIdx++;relStep()},
  'new-plan':()=>planForm(),
  plan:e=>planForm(plan(e.dataset.id)),
  'save-plan':e=>{const nom=val('pf-nom');if(!nom)return toast('Écrivez le nom');const prix=num(val('pf-prix'));if(!prix)return toast('Écrivez le prix');const d={nom,prix,periode:val('pf-per')||'mois',desc:val('pf-desc')};
    if(e.dataset.id)Object.assign(plan(e.dataset.id),d);else S.formules.push({id:uid(),...d});save();closeSheet();render();toast('Formule enregistrée')},
  'del-plan':e=>{if(S.clients.some(c=>c.planId===e.dataset.id))return toast('Des abonnés ont cette formule : changez-les d’abord');if(delArm!==e.dataset.id){delArm=e.dataset.id;e.textContent='Touchez encore pour supprimer';return}S.formules=S.formules.filter(f=>f.id!==e.dataset.id);save();closeSheet();render()},
  'ca-shift':e=>{const n=shift(caDay||today(),+e.dataset.v);if(n>today())return;caDay=n;render()},
  dem:e=>demSheet(e.dataset.id),
  'dem-reply':e=>{const d=S.demandes.find(x=>x.id===e.dataset.id);d.reponse=val('dm-rep');if(!d.reponse)return toast('Écrivez la réponse');d.statut='traite';demSave(d);save();closeSheet();render();toast('Réponse enregistrée')},

function trNode(n){if(LANG!=='wo'||!n)return;

  if(left>=0)return{st:left<=5?'warn':'ok',left,end,trial};if(-left<=GRACE_DAYS)return{st:'grace',left,end,trial};return{st:'blocked',left,end,trial}}
const WRITE=new Set(['new-client','edit-client','save-client','new-code','susp','react','del-client','enc-pick','enc','en-save','del-pay','new-plan','save-plan','del-plan','dem-reply','dem-ok','dem-ko','dem-insc','save-settings','add-ag','del-ag']);
function blockedAct(a){if(!LIC||!WRITE.has(a)||licState().st!=='blocked')return false;toast(tr('Abonnement terminé : vous pouvez regarder, pas modifier'));aboSheet();return true}

/* ---------- photo (capture du client) ---------- */
function dataToBlob(u){const [h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'})}
async function upPhoto(u,folder){if(!ONLINE||!SB||!u||!/^data:image\/(jpeg|png|webp)/.test(u))return u;
  const path=folder+'/'+Date.now().toString(36)+uid()+'.jpg';
  try{const r=await SB.storage.from(BUCKET).upload(path,dataToBlob(u),{contentType:'image/jpeg',upsert:false});if(r.error)throw r.error;return SB.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
  catch(e){return null}}

async function doLogout(){if(isDirty()){await push();if(isDirty())return toast(tr('Pas encore sauvegardé en ligne : connectez-vous à internet avant de sortir'))}

async function portalLoad(cred,silent){let r;try{r=await SB.rpc('abon_client',{p_shop:PORTAL,p_phone:cred.tel,p_code:cred.code})}catch(e){r={error:e}}
  if(r.error){const m=String(r.error.message||'');if(/code incorrect/i.test(m)){PCRED=null;try{localStorage.removeItem(PKEY)}catch(e){}}
    if(!silent)toast(tr(/code incorrect/i.test(m)?'Numéro ou code incorrect':/inactif/i.test(m)?'Espace fermé pour le moment':'Pas de connexion internet : réessayez'));return false}
  PCRED=cred;try{localStorage.setItem(PKEY,JSON.stringify(cred))}catch(e){}
  const d=r.data;const c=d.client;S.clients=[{...c,code:''}];viewAs=c.id;
  if(d.formule&&!S.formules.some(f=>f.id===d.formule.id))S.formules.push(d.formule);
  S.paiements=(d.paiements||[]).map(p=>({...p,clientId:c.id,periodes:Array.isArray(p.periodes)?p.periodes:[]}));
  S.demandes=(d.demandes||[]).map(rowDem);return true}

  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});

  'pl-out':()=>{PCRED=null;try{localStorage.removeItem(PKEY)}catch(e){}S.clients=[];S.paiements=[];S.demandes=[];viewAs=null;view='c-home';render()},
  'pw-forgot':()=>{const ph=val('au-tel');window.open(waLink(SECK_WA,`Bonjour Seck Apps, j’ai oublié mon mot de passe ${APP_NAME}.\nMon numéro : ${ph||'…'}`),'_blank','noopener');toast(tr('Seck Apps vous envoie un nouveau mot de passe sur WhatsApp'))},
  'del-acc':()=>sheet('Supprimer mon compte',`<div class="panel"><b>${tr('Attention : tout sera effacé pour toujours.')}</b><div class="small">${tr('Vos abonnés, leurs paiements, vos reçus et votre abonnement. On ne peut pas revenir en arrière.')}</div><div class="small">${tr('Si vous voulez juste faire une pause, ne supprimez pas : arrêtez de payer, vos données restent gardées.')}</div>
    <div class="f"><label for="da-ok">${tr('Pour confirmer, écrivez SUPPRIMER')}</label><input id="da-ok" autocomplete="off" autocapitalize="characters"></div>
    <button class="btn danger" data-act="del-acc-go">${tr('Supprimer mon compte pour toujours')}</button></div>`),
  'del-acc-go':async e=>{if(val('da-ok').toUpperCase()!=='SUPPRIMER')return toast(tr('Écrivez SUPPRIMER pour confirmer'));e.disabled=true;e.textContent=tr('Suppression…');
    let r;try{r=await SB.rpc('seck_supprimer_mon_compte')}catch(err){r={error:err}}
    if(r.error){e.disabled=false;e.textContent=tr('Supprimer mon compte pour toujours');return toast(/Could not find|does not exist|schema cache/i.test(r.error.message||'')?'Contactez Seck Apps pour supprimer votre compte':errTxt(r.error))}
    try{await SB.auth.signOut()}catch(err){}USER=null;S=null;LIC=null;AUTHM='login';try{Object.keys(localStorage).filter(k=>k.startsWith(LKEY)).forEach(k=>localStorage.removeItem(k))}catch(err){}
    $('#sheetRoot').innerHTML='';document.body.style.overflow='';render();toast(tr('Compte supprimé'))},
});

if(ONLINE){render();onlineBoot()}else{load();render()}
})();
</script>

</body>
</html>
